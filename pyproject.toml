[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scoring-engine"
version = "1.0.0"
description = "AI-powered lead extraction, deduplication, and scoring using the Claude API, built on top of email-phone-validator and contact-deduplicator."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matt" }]
requires-python = ">=3.11"  # pandas>=3.0.5 requires Python>=3.11
dependencies = [
    "anthropic>=0.121.0,<1.0.0",
    "pandas>=3.0.5,<4.0.0",
    "click>=8.4.2,<9.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "email-phone-validator @ git+https://github.com/Matthew-Cassin/email-phone-validator.git@v1.0.0",
    "contact-deduplicator @ git+https://github.com/Matthew-Cassin/contact-deduplicator.git@v1.0.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
keywords = ["lead-scoring", "lead-generation", "claude-api", "ai-extraction", "crm", "sales-automation"]

[project.urls]
Homepage = "https://github.com/Matthew-Cassin/lead-scoring-engine"
Repository = "https://github.com/Matthew-Cassin/lead-scoring-engine"
Issues = "https://github.com/Matthew-Cassin/lead-scoring-engine/issues"

[project.scripts]
lead-scoring-engine = "lead_scoring_engine.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_scoring_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["lead_scoring_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# python_version intentionally unset: mypy then targets whatever interpreter
# runs it, matching each CI matrix leg.
[tool.mypy]
strict = true
